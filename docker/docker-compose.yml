version: "3.8"

# ---------------------------------------------------------------------------
# BankFlow Analytics - Docker Compose
# Services: Kafka (KRaft mode, no Zookeeper needed), Airflow (LocalExecutor,
# single-container "standalone-style" webserver + scheduler), and shared
# volumes for /data and /airflow/dags.
# ---------------------------------------------------------------------------

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW_UID: "50000"
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../data:/opt/airflow/data
    - ../src:/opt/airflow/src
    - ../config:/opt/airflow/config
    - airflow-home:/opt/airflow
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bankflow-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bankflow-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bankflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  airflow-init:
    <<: *airflow-common
    container_name: bankflow-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Bank --lastname Flow \
          --role Admin --email admin@example.com || true
    depends_on: {}

  airflow-webserver:
    <<: *airflow-common
    container_name: bankflow-airflow-webserver
    command: webserver
    ports:
      - "8081:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: bankflow-airflow-scheduler
    command: scheduler
    restart: unless-stopped

volumes:
  kafka-data:
  airflow-home:
